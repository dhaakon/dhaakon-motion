[workspace]
members = ["crates/motion-ir", "crates/motion-core", "crates/motion-wasm"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
wasm-bindgen = "=0.2.114"
motion-ir = { path = "crates/motion-ir" }
motion-core = { path = "crates/motion-core" }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"
strip = "debuginfo"
